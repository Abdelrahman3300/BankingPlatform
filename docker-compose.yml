
services:
  postgres:
    image: postgres:18
    container_name: bankingplatform-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bankingplatform}
      POSTGRES_USER: ${POSTGRES_USER:-banking_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-Alaa1234}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-banking_dev} -d ${POSTGRES_DB:-bankingplatform}
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:4-management
    container_name: bankingplatform-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-banking_dev}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-local_dev_only_change_me}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  rabbitmq_data:
